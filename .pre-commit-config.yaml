repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--select, "E9,F63,F7,F82", --exclude, "notebooks,utils/legacy.py"]
  - repo: local
    hooks:
      - id: pytest-fast
        name: pytest (not slow)
        entry: pytest -m "not slow" -q
        language: system
        pass_filenames: false
        always_run: true
