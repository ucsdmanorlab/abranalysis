[pytest]
testpaths = tests
pythonpath = .
addopts = -ra
filterwarnings =
    ignore::DeprecationWarning
    ignore::FutureWarning
    ignore::UserWarning
markers =
    slow: loads ML models or does heavy I/O (deselect with -m "not slow")
    baseline: compares results to saved golden baselines in tests/baselines/ (update with --update-baselines)
    ui: drives the Streamlit app through streamlit.testing AppTest
